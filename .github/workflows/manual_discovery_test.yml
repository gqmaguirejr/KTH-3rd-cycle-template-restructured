name: Manual DiVA Discovery Test

on:
  workflow_dispatch:

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to push changes back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bibtexparser thefuzz python-Levenshtein pymods requests pandas

      - name: Run Discovery Script
        run: python3 -u scripts/DiVA_discovery.py

      - name: Verify and Commit Results
        run: |
          if [ -f "publications_map.json" ]; then
            echo "File found! Committing to repository..."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add publications_map.json
            git commit -m "Auto-generate publications map from DiVA"
            git push
          else
            echo "::error::publications_map.json was not created. Check script logs above."
            exit 1
          fi
